<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Options Price Graph</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
        }
        header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #f0f6fc;
            white-space: nowrap;
        }
        .search-bar {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .search-bar input {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 8px 12px;
            color: #f0f6fc;
            font-size: 16px;
            width: 140px;
            text-transform: uppercase;
        }
        .search-bar input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .search-bar button {
            background: #238636;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .search-bar button:hover { background: #2ea043; }
        .search-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
        .stock-info {
            font-size: 14px;
            color: #8b949e;
        }
        .stock-info .price {
            font-size: 18px;
            font-weight: 600;
            color: #58a6ff;
        }
        .tabs {
            display: flex;
            gap: 0;
            padding: 0 24px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #8b949e;
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
        }
        .tab:hover { color: #f0f6fc; }
        .tab.active {
            color: #f0f6fc;
            border-bottom-color: #f78166;
        }
        .content { padding: 24px; }
        .chart-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #loading {
            display: none;
            text-align: center;
            padding: 60px;
            color: #8b949e;
            font-size: 16px;
        }
        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #error-msg {
            display: none;
            background: #490202;
            border: 1px solid #f85149;
            border-radius: 6px;
            padding: 12px 16px;
            margin: 24px;
            color: #f85149;
        }
        #charts { display: none; }
        .welcome {
            text-align: center;
            padding: 80px 24px;
            color: #8b949e;
        }
        .welcome h2 { font-size: 24px; color: #f0f6fc; margin-bottom: 8px; }
        .table-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: auto;
            max-height: 400px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            background: #1c2128;
            position: sticky;
            top: 0;
            padding: 8px 12px;
            text-align: right;
            color: #8b949e;
            font-weight: 600;
            border-bottom: 1px solid #30363d;
        }
        th:first-child, td:first-child { text-align: left; }
        td {
            padding: 6px 12px;
            text-align: right;
            border-bottom: 1px solid #21262d;
        }
        tr:hover td { background: #1c2128; }
        .itm { color: #3fb950; }
        .otm { color: #8b949e; }
    </style>
</head>
<body>
    <header>
        <h1>Options Price Graph</h1>
        <div class="search-bar">
            <input type="text" id="ticker-input" placeholder="AAPL" maxlength="10"
                   onkeydown="if(event.key==='Enter') loadOptions()">
            <button id="load-btn" onclick="loadOptions()">Load Options</button>
        </div>
        <div class="stock-info" id="stock-info"></div>
    </header>

    <div class="tabs" id="tabs" style="display:none;">
        <div class="tab active" data-type="calls" onclick="switchTab('calls')">Calls</div>
        <div class="tab" data-type="puts" onclick="switchTab('puts')">Puts</div>
    </div>

    <div id="welcome" class="welcome">
        <h2>Stock Options Viewer</h2>
        <p>Enter a ticker symbol above to view options prices across strikes and expiration dates.</p>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <div>Loading options data...</div>
    </div>

    <div id="error-msg"></div>

    <div id="charts" class="content">
        <div class="chart-container">
            <div class="chart-title">Option Premium by Strike</div>
            <div id="price-chart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">Implied Volatility by Strike</div>
            <div id="iv-chart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">Open Interest by Strike</div>
            <div id="oi-chart"></div>
        </div>
        <div class="chart-container">
            <div class="chart-title">Data Table</div>
            <div class="table-container" id="data-table"></div>
        </div>
    </div>

    <script>
    let optionsData = null;
    let activeTab = 'calls';

    const COLORS = ['#58a6ff', '#f78166', '#3fb950', '#d2a8ff', '#f0e68c', '#ff7b72'];

    const PLOTLY_LAYOUT = {
        paper_bgcolor: '#161b22',
        plot_bgcolor: '#161b22',
        font: { color: '#8b949e', size: 12 },
        margin: { t: 30, r: 30, b: 50, l: 60 },
        legend: {
            bgcolor: 'rgba(0,0,0,0)',
            font: { color: '#e0e0e0' },
            orientation: 'h',
            y: 1.12,
        },
        xaxis: {
            gridcolor: '#21262d',
            zerolinecolor: '#30363d',
            title: { text: 'Strike Price', font: { color: '#8b949e' } },
        },
        yaxis: {
            gridcolor: '#21262d',
            zerolinecolor: '#30363d',
        },
        hovermode: 'x unified',
    };

    const PLOTLY_CONFIG = { responsive: true, displayModeBar: false };

    async function loadOptions() {
        const ticker = document.getElementById('ticker-input').value.trim().toUpperCase();
        if (!ticker) return;

        const btn = document.getElementById('load-btn');
        btn.disabled = true;
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('charts').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
        document.getElementById('tabs').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        try {
            const resp = await fetch(`/api/options/${ticker}`);
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error(err.detail || `HTTP ${resp.status}`);
            }
            optionsData = await resp.json();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('charts').style.display = 'block';
            document.getElementById('tabs').style.display = 'flex';

            const priceStr = optionsData.currentPrice
                ? `$${optionsData.currentPrice.toFixed(2)}`
                : 'N/A';
            document.getElementById('stock-info').innerHTML =
                `<span class="price">${optionsData.ticker} ${priceStr}</span> &mdash; ${optionsData.expirations.length} expirations loaded`;

            activeTab = 'calls';
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === 'calls'));
            renderCharts();
        } catch (e) {
            document.getElementById('loading').style.display = 'none';
            const errEl = document.getElementById('error-msg');
            errEl.textContent = e.message;
            errEl.style.display = 'block';
        } finally {
            btn.disabled = false;
        }
    }

    function switchTab(type) {
        activeTab = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
        renderCharts();
    }

    function renderCharts() {
        if (!optionsData) return;
        const data = activeTab === 'calls' ? optionsData.calls : optionsData.puts;
        const exps = optionsData.expirations;

        renderPriceChart(data, exps);
        renderIVChart(data, exps);
        renderOIChart(data, exps);
        renderTable(data, exps);
    }

    function makeATMLine(yaxisRange) {
        if (!optionsData.currentPrice) return [];
        return [{
            type: 'line',
            x0: optionsData.currentPrice,
            x1: optionsData.currentPrice,
            y0: 0,
            y1: 1,
            yref: 'paper',
            line: { color: '#f0e68c', width: 1, dash: 'dash' },
        }];
    }

    function renderPriceChart(data, exps) {
        const traces = exps.map((exp, i) => {
            const chain = data[exp] || [];
            return {
                x: chain.map(c => c.strike),
                y: chain.map(c => c.lastPrice),
                name: exp,
                type: 'scatter',
                mode: 'lines+markers',
                marker: { size: 4 },
                line: { color: COLORS[i % COLORS.length], width: 2 },
                hovertemplate: 'Strike: $%{x}<br>Price: $%{y:.2f}<extra>' + exp + '</extra>',
            };
        });

        const layout = {
            ...PLOTLY_LAYOUT,
            yaxis: { ...PLOTLY_LAYOUT.yaxis, title: { text: 'Premium ($)', font: { color: '#8b949e' } } },
            shapes: makeATMLine(),
        };

        Plotly.newPlot('price-chart', traces, layout, PLOTLY_CONFIG);
    }

    function renderIVChart(data, exps) {
        const traces = exps.map((exp, i) => {
            const chain = data[exp] || [];
            return {
                x: chain.map(c => c.strike),
                y: chain.map(c => c.impliedVolatility != null ? (c.impliedVolatility * 100) : null),
                name: exp,
                type: 'scatter',
                mode: 'lines+markers',
                marker: { size: 4 },
                line: { color: COLORS[i % COLORS.length], width: 2 },
                hovertemplate: 'Strike: $%{x}<br>IV: %{y:.1f}%<extra>' + exp + '</extra>',
            };
        });

        const layout = {
            ...PLOTLY_LAYOUT,
            yaxis: { ...PLOTLY_LAYOUT.yaxis, title: { text: 'Implied Volatility (%)', font: { color: '#8b949e' } } },
            shapes: makeATMLine(),
        };

        Plotly.newPlot('iv-chart', traces, layout, PLOTLY_CONFIG);
    }

    function renderOIChart(data, exps) {
        const traces = exps.map((exp, i) => {
            const chain = data[exp] || [];
            return {
                x: chain.map(c => c.strike),
                y: chain.map(c => c.openInterest),
                name: exp,
                type: 'bar',
                marker: { color: COLORS[i % COLORS.length], opacity: 0.7 },
                hovertemplate: 'Strike: $%{x}<br>OI: %{y:,}<extra>' + exp + '</extra>',
            };
        });

        const layout = {
            ...PLOTLY_LAYOUT,
            barmode: 'group',
            yaxis: { ...PLOTLY_LAYOUT.yaxis, title: { text: 'Open Interest', font: { color: '#8b949e' } } },
            shapes: makeATMLine(),
        };

        Plotly.newPlot('oi-chart', traces, layout, PLOTLY_CONFIG);
    }

    function renderTable(data, exps) {
        if (!exps.length) return;
        // Show the first expiration's data in the table
        const exp = exps[0];
        const chain = data[exp] || [];

        let html = `<table>
            <thead><tr>
                <th>Strike</th><th>Last</th><th>Bid</th><th>Ask</th>
                <th>Volume</th><th>Open Int</th><th>IV</th><th>ITM</th>
            </tr></thead><tbody>`;

        for (const row of chain) {
            const cls = row.inTheMoney ? 'itm' : 'otm';
            html += `<tr class="${cls}">
                <td>$${row.strike.toFixed(2)}</td>
                <td>$${fmt(row.lastPrice)}</td>
                <td>$${fmt(row.bid)}</td>
                <td>$${fmt(row.ask)}</td>
                <td>${fmtInt(row.volume)}</td>
                <td>${fmtInt(row.openInterest)}</td>
                <td>${row.impliedVolatility != null ? (row.impliedVolatility * 100).toFixed(1) + '%' : '-'}</td>
                <td>${row.inTheMoney ? 'Yes' : 'No'}</td>
            </tr>`;
        }

        html += '</tbody></table>';
        document.getElementById('data-table').innerHTML =
            `<div style="padding:8px 12px;color:#8b949e;font-size:12px;">Showing: ${exp} (${activeTab})</div>` + html;
    }

    function fmt(v) { return v != null ? v.toFixed(2) : '-'; }
    function fmtInt(v) { return v != null ? v.toLocaleString() : '-'; }
    </script>
</body>
</html>
